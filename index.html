<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storage — Crackedperson</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,58,237,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* Header */
    header {
      padding: 60px 0 40px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 30px rgba(124,58,237,0.4);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* Stats bar */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 32px 0;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .stat { text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--accent2); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Search */
    .search-bar {
      position: relative;
      margin-bottom: 32px;
    }

    .search-bar input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }

    .search-bar input::placeholder { color: var(--muted); }

    .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    /* Release sections */
    .release {
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .release:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.2), 0 8px 32px rgba(0,0,0,0.3);
    }

    .release-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .release-tag {
      background: linear-gradient(135deg, var(--accent), #9f5ff5);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .release-name {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
    }

    .release-date {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* File list */
    .file-list { padding: 12px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .file-item:hover { background: rgba(124,58,237,0.08); }

    .file-icon {
      width: 40px; height: 40px;
      background: rgba(124,58,237,0.12);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .download-btn {
      display: flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .download-btn:hover { opacity: 0.85; transform: translateY(-1px); }

    /* Loading / empty */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    footer {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .stats { gap: 16px; }
      .release-header { flex-wrap: wrap; }
      .file-item { flex-wrap: wrap; }
      .download-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">📦</div>
        <span class="logo-text">Storage</span>
      </div>
      <p class="tagline"><span class="pulse"></span>Crackedperson's file storage — always up to date</p>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="stat-releases">—</div>
        <div class="stat-label">Releases</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-files">—</div>
        <div class="stat-label">Files</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-size">—</div>
        <div class="stat-label">Total Size</div>
      </div>
    </div>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search files..." oninput="filterFiles()" />
    </div>

    <div id="releases-container">
      <div class="state-msg">
        <div class="spinner"></div>
        <p>Fetching latest releases…</p>
      </div>
    </div>

    <footer>
      Powered by <a href="https://github.com/Crackedperson/Storage" target="_blank">GitHub Releases</a> &mdash; auto-updates with every new release
    </footer>
  </div>

  <script>
    const REPO = 'Crackedperson/Storage';
    const API  = `https://api.github.com/repos/${REPO}/releases`;

    let allReleases = [];

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function fileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      const map = { exe:'⚙️', zip:'🗜️', tar:'🗜️', gz:'🗜️', pdf:'📄', txt:'📝', png:'🖼️', jpg:'🖼️', gif:'🖼️', mp4:'🎬', mp3:'🎵', apk:'📱', dmg:'💿', iso:'💿', py:'🐍', js:'📜', json:'📋' };
      return map[ext] || '📦';
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr);
      const days = Math.floor(diff / 86400000);
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 30) return `${days} days ago`;
      if (days < 365) return `${Math.floor(days/30)} months ago`;
      return `${Math.floor(days/365)} years ago`;
    }

    function renderReleases(releases) {
      const container = document.getElementById('releases-container');
      const query = document.getElementById('search').value.toLowerCase();

      if (!releases.length) {
        container.innerHTML = `<div class="state-msg"><p>No releases found.</p></div>`;
        return;
      }

      let html = '';
      let totalFiles = 0;
      let totalSize = 0;
      let visibleCount = 0;

      releases.forEach(rel => {
        const assets = rel.assets.filter(a => !query || a.name.toLowerCase().includes(query));
        if (!assets.length && query) return;
        visibleCount++;

        html += `<div class="release">
          <div class="release-header">
            <span class="release-tag">${rel.tag_name}</span>
            <span class="release-name">${rel.name || rel.tag_name}</span>
            <span class="release-date">${timeAgo(rel.published_at)}</span>
          </div>
          <div class="file-list">`;

        if (!assets.length) {
          html += `<div style="padding:16px 14px;color:var(--muted);font-size:14px;">No files in this release.</div>`;
        } else {
          assets.forEach(asset => {
            totalFiles++;
            totalSize += asset.size;
            html += `<a class="file-item" href="${asset.browser_download_url}" target="_blank" rel="noopener">
              <div class="file-icon">${fileIcon(asset.name)}</div>
              <div class="file-info">
                <div class="file-name">${asset.name}</div>
                <div class="file-size">${formatBytes(asset.size)} &bull; ${asset.download_count} downloads</div>
              </div>
              <a class="download-btn" href="${asset.browser_download_url}" download>
                ⬇ Download
              </a>
            </a>`;
          });
        }

        html += `</div></div>`;
      });

      if (!visibleCount) {
        container.innerHTML = `<div class="state-msg"><p>No files match "<strong>${query}</strong>".</p></div>`;
        return;
      }

      container.innerHTML = html;

      // Update stats
      document.getElementById('stat-releases').textContent = releases.length;
      document.getElementById('stat-files').textContent = totalFiles;
      document.getElementById('stat-size').textContent = formatBytes(totalSize);
    }

    function filterFiles() {
      renderReleases(allReleases);
    }

    async function loadReleases() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        allReleases = await res.json();
        renderReleases(allReleases);
      } catch (e) {
        document.getElementById('releases-container').innerHTML =
          `<div class="state-msg"><p>⚠️ Could not load releases.<br><small>${e.message}</small></p></div>`;
      }
    }

    loadReleases();
  </script>
</body>
</html>
